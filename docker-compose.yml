services:
  mysql:
    image: mysql:8.0
    container_name: fabflix-mysql
    restart: unless-stopped
    # mysql_native_password (instead of MySQL 8's default caching_sha2_password) avoids
    # a JDBC-over-plain-TCP auth failure that caching_sha2_password triggers unless the
    # connection is TLS or does a full RSA key exchange. Fine for local dev; revisit if
    # this ever needs to be a hardened/production auth setup.
    #
    # character-set-server/collation-server force utf8mb4 as the server default so any
    # client (including the mysql CLI that loads db/init/*.sql, and our JDBC connection)
    # that doesn't explicitly negotiate a charset still gets one that can round-trip the
    # accented names in the seed data correctly. Belt-and-suspenders alongside the
    # `SET NAMES utf8mb4;` line each db/init/*.sql file now starts with.
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: moviedb
      MYSQL_USER: ${DB_USERNAME:-fabflix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fabflix}
    ports:
      - "3306:3306"
    volumes:
      - fabflix-mysql-data:/var/lib/mysql
      # Files here run once, in filename order, ONLY on first container start
      # (i.e. only when the data volume is empty). Delete the volume to reseed.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: fabflix-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  fabflix-mysql-data:
