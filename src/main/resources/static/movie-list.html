<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="brand">Fab<span>flix</span></div>
    <button id="back-main" class="btn-ghost">Back to Main</button>
</header>

<div class="page">
    <h1>Movie Results</h1>

    <div class="controls-bar">
        <span>
            <label for="sort-by">Sort by</label>
            <select id="sort-by">
                <option value="title_rating_asc">Title ↑</option>
                <option value="title_rating_desc">Title ↓</option>
                <option value="rating_title_asc">Rating ↑</option>
                <option value="rating_title_desc">Rating ↓</option>
            </select>
        </span>

        <span>
            <label for="page-size">Per page</label>
            <select id="page-size">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </span>
    </div>

    <div id="movie-grid" class="movie-grid"></div>

    <div id="pagination">
        <button id="prev-page" class="btn-ghost">Previous</button>
        <span id="page-info"></span>
        <button id="next-page" class="btn-ghost">Next</button>
    </div>
</div>

<script src="js/shared.js"></script>
<script src="js/movie-list.js"></script>
</body>
</html>
