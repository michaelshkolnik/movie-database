<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fabflix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="brand">Fab<span>flix</span></div>
</header>

<div class="page">
    <section id="search-section">
        <h2>Search Movies</h2>

        <form id="search-form" class="search-bar">
            <div class="search-field">
                <input type="text" id="title-input" name="title" placeholder="Title" autocomplete="off">
                <div id="autocomplete-box" class="autocomplete-box"></div>
            </div>

            <input type="text" name="year" placeholder="Year">
            <input type="text" name="director" placeholder="Director">
            <input type="text" name="star" placeholder="Star">
            <button type="submit">Search</button>
        </form>
    </section>

    <section id="browse-section">
        <h2>Browse by Genre</h2>
        <div id="genre-list" class="browse-links"></div>

        <h2>Browse by Title</h2>
        <div id="letter-list" class="browse-links"></div>
    </section>
</div>

<script src="js/shared.js"></script>
<script src="js/main.js"></script>
</body>
</html>
