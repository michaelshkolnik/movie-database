<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
    <div class="brand">Fab<span>flix</span></div>
    <button id="back-results" class="btn-ghost">Back to Results</button>
</header>

<div id="movie-backdrop" class="backdrop-banner"></div>

<div class="page">
    <h1 id="movie-title">Movie Details</h1>

    <section id="movie-details" class="detail-layout">
        <img id="movie-poster" class="poster-large" alt="" hidden>
        <div class="detail-info">
            <p><strong>Year</strong> <span id="movie-year"></span></p>
            <p><strong>Director</strong> <span id="movie-director"></span></p>
            <p><strong>Rating</strong> <span id="movie-rating"></span></p>
            <p><strong>Genres</strong> <span id="movie-genres"></span></p>
            <p><strong>Stars</strong> <span id="movie-stars"></span></p>
            <p id="movie-overview" class="overview"></p>
        </div>
    </section>
</div>

<script src="js/shared.js"></script>
<script src="js/single-movie.js"></script>
</body>
</html>
